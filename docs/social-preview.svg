<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-label="battguard + lidguard" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1280 640"><rect width="1280" height="640" fill="#0f172a"/><g transform="translate(96 176) scale(1.125)"><rect width="256" height="256" fill="#111827" stroke="#1e293b" stroke-width="2" rx="56"/><circle cx="166" cy="82" r="36" fill="#fbbf24"/><circle cx="184" cy="68" r="34" fill="#111827"/><rect width="176" height="14" x="40" y="146" fill="#e2e8f0" rx="7"/><rect width="24" height="4" x="116" y="149" fill="#94a3b8" rx="2"/><path fill="#94a3b8" d="M30 164 H226 L234 180 Q234 186 228 186 H28 Q22 186 22 180 Z"/><rect width="60" height="28" x="92" y="202" fill="none" stroke="#4ade80" stroke-width="4" rx="7"/><rect width="7" height="12" x="154" y="210" fill="#4ade80" rx="2"/><rect width="22" height="14" x="99" y="209" fill="#4ade80" rx="2"/></g><text x="440" y="236" fill="#f8fafc" font-size="64" font-weight="700">battguard <tspan fill="#fbbf24">+</tspan> lidguard</text><text x="440" y="292" fill="#94a3b8" font-size="28">Guards for a MacBook that runs with the lid closed</text><g fill="#e2e8f0" font-size="24"><circle cx="452" cy="364" r="6" fill="#4ade80"/><text x="476" y="372">low battery: alarm, then let the Mac sleep instead of dying</text><circle cx="452" cy="420" r="6" fill="#fbbf24"/><text x="476" y="428">lid closed: screen off in seconds, not hours</text><circle cx="452" cy="476" r="6" fill="#94a3b8"/><text x="476" y="484">two launchd jobs, no dependencies, MIT</text></g><text x="440" y="560" fill="#64748b" font-size="22">pmset -a disablesleep 1 · github.com/karmahacker/battguard</text></svg>