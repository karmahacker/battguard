<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" aria-label="How lidguard and battguard work" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" viewBox="0 0 960 440"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="960" height="440" fill="#0f172a" rx="18"/><line x1="480" x2="480" y1="36" y2="404" stroke="#1e293b" stroke-width="2"/><text x="40" y="58" fill="#fbbf24" font-size="20" font-weight="700">lidguard</text><text x="128" y="58" fill="#94a3b8" font-size="15">lid closed, screen off</text><g fill="#e2e8f0" font-size="14"><rect width="170" height="40" x="40" y="84" fill="#1e293b" stroke="#334155" rx="9"/><text x="125" y="109" text-anchor="middle">lid closes</text><line x1="214" x2="286" y1="104" y2="104" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="96" fill="#94a3b8" font-size="12" text-anchor="middle">1.5 s</text><rect width="150" height="40" x="290" y="84" fill="#0b2a1f" stroke="#15803d" rx="9"/><text x="365" y="109" fill="#86efac" text-anchor="middle">display off</text><rect width="170" height="40" x="40" y="152" fill="#1e293b" stroke="#334155" rx="9"/><text x="125" y="171" text-anchor="middle">display wakes</text><text x="125" y="186" fill="#94a3b8" font-size="11" text-anchor="middle">while the lid is still closed</text><line x1="214" x2="286" y1="172" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="164" fill="#94a3b8" font-size="12" text-anchor="middle">5 s, max 10×</text><rect width="150" height="40" x="290" y="152" fill="#0b2a1f" stroke="#15803d" rx="9"/><text x="365" y="177" fill="#86efac" text-anchor="middle">display off again</text><rect width="170" height="40" x="40" y="220" fill="#1e293b" stroke="#334155" rx="9"/><text x="125" y="245" text-anchor="middle">lid opens</text><line x1="214" x2="286" y1="240" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">at once</text><rect width="150" height="40" x="290" y="220" fill="#2a1f0b" stroke="#b45309" rx="9"/><text x="365" y="245" fill="#fcd34d" text-anchor="middle">display on</text><rect width="170" height="40" x="40" y="288" fill="#1e293b" stroke="#334155" rx="9"/><text x="125" y="313" text-anchor="middle">external display attached</text><line x1="214" x2="286" y1="308" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="40" x="290" y="288" fill="#1e293b" stroke="#334155" stroke-dasharray="5 4" rx="9"/><text x="365" y="313" fill="#94a3b8" text-anchor="middle">nothing (clamshell)</text></g><text x="40" y="364" fill="#64748b" font-size="12">launchd agent in the login session · kernel clamshell notification</text><text x="40" y="382" fill="#64748b" font-size="12">pmset displaysleepnow, works unprivileged inside the session</text><text x="40" y="400" fill="#64748b" font-size="12">re-sleep cap: a wrong lid reading can never fight you for the screen</text><text x="520" y="58" fill="#fbbf24" font-size="20" font-weight="700">battguard</text><text x="624" y="58" fill="#94a3b8" font-size="15">low battery, closed-lid mode</text><rect width="400" height="30" x="520" y="92" fill="#1e293b" stroke="#334155" rx="7"/><rect width="356" height="26" x="522" y="94" fill="#166534" rx="5"/><rect width="20" height="26" x="878" y="94" fill="#b45309"/><path fill="#b91c1c" d="M898 94 H912 Q918 94 918 100 V114 Q918 120 912 120 H898 Z"/><rect width="6" height="14" x="924" y="100" fill="#334155" rx="2"/><g fill="#94a3b8" font-size="11"><text x="522" y="138">100 %</text><text x="878" y="138" text-anchor="middle">10 %</text><text x="912" y="138" text-anchor="middle">5 %</text></g><g fill="#e2e8f0" font-size="14"><circle cx="530" cy="178" r="7" fill="#b45309"/><text x="548" y="183">10 % … 6 %: alarm every minute</text><text x="548" y="200" fill="#94a3b8" font-size="12">notification with sound + spoken warning</text><circle cx="530" cy="236" r="7" fill="#b91c1c"/><text x="548" y="241">≤ 5 %: normal sleep rules back on</text><text x="548" y="258" fill="#94a3b8" font-size="12">pmset -a disablesleep 0, then pmset sleepnow if the lid is closed</text><circle cx="530" cy="294" r="7" fill="#15803d"/><text x="548" y="299">charger back: closed-lid mode restored</text><text x="548" y="316" fill="#94a3b8" font-size="12">pmset -a disablesleep 1, only if battguard was the one that cleared it</text></g><text x="520" y="372" fill="#64748b" font-size="12">root launchd daemon · polls pmset -g batt every 60 s</text><text x="520" y="392" fill="#64748b" font-size="12">silent when closed-lid mode is off: macOS handles low battery itself</text></svg>